name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest && pip install -r backend_api/requirements.txt && cd backend_api && python -m pytest -q
      - run: pip install -r ai_engine/requirements.txt && cd ai_engine && python -m pytest -q
      - run: cp .env.example .env && docker compose config -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: cd web && npm install && npm run build
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright && playwright install --with-deps chromium
      - run: (cd docs && python -m http.server 8000 &) && sleep 2 && BASE=http://localhost:8000 python e2e/smoke.py
