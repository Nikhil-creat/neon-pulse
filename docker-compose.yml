name: neon-pulse
x-svc: &svc
  restart: unless-stopped
  env_file: .env
  networks: [neon]
services:
  postgres:
    <<: *svc
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: "${POSTGRES_DB}"}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER}"], interval: 5s, retries: 10}
  redis:
    <<: *svc
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 5s, retries: 10}
  qdrant:
    <<: *svc
    image: qdrant/qdrant:latest
    volumes: [qdrant:/qdrant/storage]
  ai_engine:
    <<: *svc
    build: ./ai_engine
    depends_on: [qdrant]
    healthcheck: {test: ["CMD","python","-c","import urllib.request as u;u.urlopen('http://localhost:8001/health')"], interval: 10s, retries: 10, start_period: 60s}
  vision_service:
    <<: *svc
    build: ./vision_service
    healthcheck: {test: ["CMD","python","-c","import urllib.request as u;u.urlopen('http://localhost:8002/health')"], interval: 10s, retries: 10}
  backend_api:
    <<: *svc
    build: ./backend_api
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}, ai_engine: {condition: service_started}}
    ports: ["8000:8000"]
    healthcheck: {test: ["CMD","python","-c","import urllib.request as u;u.urlopen('http://localhost:8000/health')"], interval: 10s, retries: 10}
  frontend:
    <<: *svc
    build: {context: ., dockerfile: frontend/Dockerfile}
    ports: ["8080:8080"]
  avatar_service:  # optional: docker compose --profile avatar up
    <<: *svc
    profiles: ["avatar"]
    build: ./avatar_service
    volumes: [hf:/hf]
    ports: ["8003:8003"]
  web:  # optional Next.js app: docker compose --profile next up
    <<: *svc
    profiles: ["next"]
    build: {context: ./web, args: {NEXT_PUBLIC_API_URL: "http://localhost:8000"}}
    ports: ["8081:8080"]
  prometheus:  # optional: docker compose --profile obs up
    <<: *svc
    profiles: ["obs"]
    image: prom/prometheus:v2.55.0
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    <<: *svc
    profiles: ["obs"]
    image: grafana/grafana:11.3.0
    environment: {GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"}
    volumes: ["./observability/grafana/provisioning:/etc/grafana/provisioning:ro", "./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro"]
    ports: ["3000:3000"]
networks: {neon: {driver: bridge}}
volumes: {pgdata: {}, qdrant: {}, hf: {}}
