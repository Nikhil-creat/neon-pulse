name: neon-pulse
x-svc: &svc
  restart: unless-stopped
  env_file: .env
  networks: [neon]
services:
  postgres:
    <<: *svc
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: "${POSTGRES_DB}"}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER}"], interval: 5s, retries: 10}
  redis:
    <<: *svc
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 5s, retries: 10}
  qdrant:
    <<: *svc
    image: qdrant/qdrant:latest
    volumes: [qdrant:/qdrant/storage]
  ai_engine:
    <<: *svc
    build: ./ai_engine
    depends_on: [qdrant]
    healthcheck: {test: ["CMD","python","-c","import urllib.request as u;u.urlopen('http://localhost:8001/health')"], interval: 10s, retries: 10, start_period: 60s}
  vision_service:
    <<: *svc
    build: ./vision_service
    healthcheck: {test: ["CMD","python","-c","import urllib.request as u;u.urlopen('http://localhost:8002/health')"], interval: 10s, retries: 10}
  backend_api:
    <<: *svc
    build: ./backend_api
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}, ai_engine: {condition: service_started}}
    ports: ["8000:8000"]
    healthcheck: {test: ["CMD","python","-c","import urllib.request as u;u.urlopen('http://localhost:8000/health')"], interval: 10s, retries: 10}
  frontend:
    <<: *svc
    build: {context: ., dockerfile: frontend/Dockerfile}
    ports: ["8080:8080"]
networks: {neon: {driver: bridge}}
volumes: {pgdata: {}, qdrant: {}}
